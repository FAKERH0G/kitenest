[package]
name = "kitenest"
version = "0.1.1"
edition = "2024"
description = "A friendly package manager for Fedora-family Linux"
license = "GPL-3.0-or-later"

[features]
default = []
gui = ["dep:gtk4", "dep:libadwaita", "dep:glib"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
glib = { version = "0.21", optional = true }
gtk4 = { version = "0.10", optional = true }
libadwaita = { version = "0.8", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"

[[bin]]
name = "kitenest"
path = "src/main.rs"

[[bin]]
name = "kitenest-gui"
path = "src/bin/kitenest-gui.rs"
required-features = ["gui"]

[[bin]]
name = "kitenest-privileged"
path = "src/bin/kitenest-privileged.rs"
