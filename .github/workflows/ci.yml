name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libadwaita-1-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check packaging scripts
        run: bash -n scripts/prepare-rpm-sources.sh packaging/build-appimage.sh
      - name: Run tests
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build GUI and CLI
        run: cargo build --locked --release --all-features
